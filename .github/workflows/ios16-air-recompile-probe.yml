name: MCLA iOS 16 - synthetic AIR compiler experiment
on:
  workflow_dispatch:
  push:
    branches: [ios16-native-backport]
    paths:
      - '.github/workflows/ios16-air-recompile-probe.yml'
      - 'tools/ios16_extract_air.py'
permissions:
  contents: read
jobs:
  synthetic-air-only:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile the same public source directly for both targets
        run: |
          set -euo pipefail
          mkdir -p out/air-compiler-probe
          cat > out/air-compiler-probe/synthetic.metal <<'METAL'
          #include <metal_stdlib>
          using namespace metal;
          constant uint flags [[function_constant(0)]];
          struct Heap { texture2d<float> tex; };
          struct Samplers { sampler value; };
          struct Constants { ulong address; };
          struct Varyings { float4 position [[position]]; float2 uv; };
          struct Attributes { float4 position [[attribute(0)]]; float2 uv [[attribute(1)]]; };
          vertex Varyings vertexProbe(Attributes input [[stage_in]],
                                     constant Constants& constants [[buffer(8)]]) {
              float4 scale = *reinterpret_cast<device float4*>(constants.address);
              return {input.position * scale, input.uv};
          }
          fragment float4 probe(Varyings input [[stage_in]],
                                constant Heap* heap [[buffer(0)]],
                                constant Samplers* samplers [[buffer(4)]],
                                constant Constants& constants [[buffer(8)]]) {
              float4 value = *reinterpret_cast<device float4*>(constants.address);
              float4 color = heap[0].tex.sample(samplers[0].value, input.uv);
              if (is_function_constant_defined(flags) && (flags & 1)) color = saturate(color);
              return value * color;
          }
          METAL
          for config in ios18 ios16; do
            if [[ "$config" == ios18 ]]; then minimum=18.0; standard=metal3.1; else minimum=16.0; standard=metal3.0; fi
            xcrun -sdk iphoneos metal -std="$standard" -mios-version-min="$minimum" \
              -c out/air-compiler-probe/synthetic.metal -o "out/air-compiler-probe/$config.air"
            xcrun -sdk iphoneos metal -std="$standard" -mios-version-min="$minimum" \
              -S -emit-llvm out/air-compiler-probe/synthetic.metal -o "out/air-compiler-probe/$config.ll"
            xcrun -sdk iphoneos metal -mios-version-min="$minimum" \
              "out/air-compiler-probe/$config.air" -o "out/air-compiler-probe/$config.metallib"
          done
          diff -u out/air-compiler-probe/ios16.ll out/air-compiler-probe/ios18.ll > out/air-compiler-probe/targets.diff || test "$?" -eq 1
      - name: Extract intact modern AIR and disassemble with Apple's compiler
        run: |
          set -euo pipefail
          python3 tools/ios16_extract_air.py out/air-compiler-probe/ios18.metallib out/air-compiler-probe/modules
          for module in out/air-compiler-probe/modules/*.bc; do
            xcrun -sdk iphoneos metal -x ir -mios-version-min=18.0 -S -emit-llvm \
              "$module" -o "${module%.bc}.ll"
          done
      - name: Record the unmodified AIR compatibility result
        run: |
          python3 - <<'PYTHON'
          import json, pathlib, subprocess
          output = pathlib.Path('out/air-compiler-probe')
          results = []
          commands = [
              ['xcrun', '-sdk', 'iphoneos', 'metal', '-x', 'ir', '-mios-version-min=16.0',
               '-c', str(output / 'ios18.air'), '-o', str(output / 'recompiled.air')],
              ['xcrun', '-sdk', 'iphoneos', 'metal', '-mios-version-min=16.0',
               str(output / 'recompiled.air'), '-o', str(output / 'recompiled.metallib')],
          ]
          for command in commands:
              result = subprocess.run(command, capture_output=True, text=True)
              results.append({'command': command, 'returncode': result.returncode,
                              'stdout': result.stdout, 'stderr': result.stderr})
              print(result.stdout + result.stderr)
              if result.returncode: break
          (output / 'unmodified-retarget-result.json').write_text(json.dumps(results, indent=2) + '\n')
          print('Diagnostic only. Successful direct iOS 16 source compilation is the baseline.')
          PYTHON
      - name: Record available Apple compiler options
        if: always()
        run: |
          xcrun -sdk iphoneos metal --help-hidden > out/air-compiler-probe/metal-help.txt 2>&1 || true
          xcrun -sdk iphoneos metal -cc1 --help > out/air-compiler-probe/metal-cc1-help.txt 2>&1 || true
      - name: Validate the direct iOS 16 baseline
        env:
          MCLA_IOS_MIN: '16.0'
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          from mcla_metal_target import validate_library
          p = Path('out/air-compiler-probe/ios16.metallib')
          print('Direct source baseline:', validate_library(p.read_bytes(), '16.0'))
          print('Synthetic compiler experiment only; no game shader or device execution tested.')
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MCLA-Synthetic-AIR-Comparison
          path: out/air-compiler-probe
          retention-days: 7
