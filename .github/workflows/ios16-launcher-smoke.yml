name: MCLA iOS 16 - launcher compilation
on:
  workflow_dispatch:
  push:
    branches: [ios16-native-backport]
    paths:
      - 'MCLAApp/CMakeLists.txt'
      - 'MCLAApp/CMakePresets.json'
      - 'MCLAApp/runtime/MCLAGraphicsFoundation.h'
      - 'MCLAApp/runtime/MCLAGraphicsFoundation.mm'
      - 'MCLAApp/ios/MCLAViewController.mm'
      - 'MCLAApp/ios/MCLAControlArtwork.h'
      - 'MCLAApp/ios/MCLAXboxTouchLayout.h'
      - 'MCLAApp/runtime/MCLAControllerInput.h'
      - 'MCLAApp/runtime/MCLABootstrapSubsystems.cpp'
      - 'tools/test_mcla_controller_input.cpp'
      - 'tools/test_ios16_controller_ui.sh'
      - 'tools/launcher_preview/**'
      - 'MCLAApp/ios/MCLAISOReader.h'
      - 'MCLAApp/ios/MCLAISOReader.cpp'
      - 'MCLAApp/ios/MCLALauncherView.h'
      - 'MCLAApp/ios/MCLALauncherView.mm'
      - 'MCLAApp/Resources/GameDataManifest.json'
      - 'tools/ios16_bind_aot_graphics.py'
      - 'tools/test_ios16_aot_graphics.py'
      - 'MCLAApp/runtime/MCLAShaderLibraryBytes.h'
      - 'MCLAApp/runtime/MCLAMetalLibrary.h'
      - 'MCLAApp/runtime/MCLAMetalRenderer.mm'
      - 'MCLAApp/runtime/MCLAVisualExperiments.h'
      - 'tools/test_mcla_visual_experiments.cpp'
      - 'tools/test_mcla_metal_library.mm'
      - '.github/workflows/ios16-launcher-smoke.yml'
jobs:
  build-launcher:
    runs-on: macos-15
    steps:
      - name: Checkout launcher source
        uses: actions/checkout@v4
      - name: Show tool versions
        run: |
          xcodebuild -version
          cmake --version
      - name: Check native graphics hook linker bindings
        run: python3 tools/test_ios16_aot_graphics.py -v
      - name: Stress the owned-byte Metal loader with limited file descriptors
        run: |
          xcrun clang++ -std=c++23 -fobjc-arc -fblocks tools/test_mcla_metal_library.mm \
            -framework Foundation -framework Metal -o /tmp/mcla-library-test
          /tmp/mcla-library-test
      - name: Check full-screen overlays and authored HUD placement
        run: |
          for name in controller_input visual_experiments control_overhaul metal_presentation; do
            xcrun clang++ -std=c++20 -O2 -fsanitize=undefined "tools/test_mcla_${name}.cpp" -o "/tmp/mcla-${name}"
            "/tmp/mcla-${name}"
          done
      - name: Configure native iOS 16 ARM64 launcher
        run: |
          cmake --preset ios16-launcher-only -S MCLAApp \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DMCLA_DEVELOPMENT_TEAM=
      - name: Compile without private game code or signing
        run: |
          cmake --build out/build/ios16-launcher-only --config Release --target MCLAApp
      - name: Inspect produced app deployment target
        run: |
          APP=out/build/ios16-launcher-only/Release-iphoneos/MCLAApp.app
          test -f "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")" = '16.0'
      - name: Package isolated launcher-only IPA (no game code)
        run: |
          set -euo pipefail
          APP=out/build/ios16-launcher-only/Release-iphoneos/MCLAApp.app
          if find "$APP" -type f \( -iname '*.xex' -o -iname '*.rpf' -o -iname '*.iso' \) | grep -q .; then
            echo "Game-derived data found in launcher-only artifact" >&2
            exit 1
          fi
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --strict "$APP"
          mkdir -p output/Payload
          ditto "$APP" output/Payload/MCLAApp.app
          (
            cd output
            zip -qry MCLA-iOS16-LAUNCHER-ONLY-NO-GAME.ipa Payload
          )
          unzip -t output/MCLA-iOS16-LAUNCHER-ONLY-NO-GAME.ipa | tail -1
      - name: Upload iOS16 diagnostic launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCLA-iOS16-LAUNCHER-ONLY-NO-GAME
          path: output/MCLA-iOS16-LAUNCHER-ONLY-NO-GAME.ipa
          if-no-files-found: error
          retention-days: 7

  controller-ui:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Exercise production touch controls with simulated controller connection changes
        run: |
          mkdir -p out/controller-ui
          bash tools/test_ios16_controller_ui.sh out/controller-ui > out/controller-ui/build.log 2>&1 || {
            tail -n 180 out/controller-ui/build.log
            exit 1
          }
          tail -n 35 out/controller-ui/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MCLA-Controller-UI-Preview
          path: |
            out/controller-ui/*.log
            out/controller-ui/*.png
          if-no-files-found: warn
          retention-days: 7
