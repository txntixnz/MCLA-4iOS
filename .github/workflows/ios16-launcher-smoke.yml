name: MCLA iOS 16 - launcher compilation
on:
  workflow_dispatch:
  push:
    branches: [ios16-native-backport]
    paths:
      - 'MCLAApp/CMakeLists.txt'
      - 'MCLAApp/CMakePresets.json'
      - 'MCLAApp/runtime/MCLAGraphicsFoundation.h'
      - 'MCLAApp/runtime/MCLAGraphicsFoundation.mm'
      - 'MCLAApp/ios/MCLAViewController.mm'
      - 'MCLAApp/ios/MCLAISOReader.h'
      - 'MCLAApp/ios/MCLAISOReader.cpp'
      - 'MCLAApp/ios/MCLALauncherView.h'
      - 'MCLAApp/ios/MCLALauncherView.mm'
      - 'MCLAApp/Resources/GameDataManifest.json'
      - '.github/workflows/ios16-launcher-smoke.yml'
jobs:
  build-launcher:
    runs-on: macos-15
    steps:
      - name: Checkout launcher source
        uses: actions/checkout@v4
      - name: Show tool versions
        run: |
          xcodebuild -version
          cmake --version
      - name: Configure native iOS 16 ARM64 launcher
        run: |
          cmake --preset ios16-launcher-only -S MCLAApp \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DMCLA_DEVELOPMENT_TEAM=
      - name: Compile without private game code or signing
        run: |
          cmake --build out/build/ios16-launcher-only --config Release --target MCLAApp
      - name: Inspect produced app deployment target
        run: |
          APP=out/build/ios16-launcher-only/Release-iphoneos/MCLAApp.app
          test -f "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")" = '16.0'
      - name: Package isolated launcher-only IPA (no game code)
        run: |
          set -euo pipefail
          APP=out/build/ios16-launcher-only/Release-iphoneos/MCLAApp.app
          if find "$APP" -type f \( -iname '*.xex' -o -iname '*.rpf' -o -iname '*.iso' \) | grep -q .; then
            echo "Game-derived data found in launcher-only artifact" >&2
            exit 1
          fi
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --strict "$APP"
          mkdir -p output/Payload
          ditto "$APP" output/Payload/MCLAApp.app
          (
            cd output
            zip -qry MCLA-iOS16-LAUNCHER-ONLY-NO-GAME.ipa Payload
          )
          unzip -t output/MCLA-iOS16-LAUNCHER-ONLY-NO-GAME.ipa | tail -1
      - name: Upload iOS16 diagnostic launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCLA-iOS16-LAUNCHER-ONLY-NO-GAME
          path: output/MCLA-iOS16-LAUNCHER-ONLY-NO-GAME.ipa
          if-no-files-found: error
          retention-days: 7
